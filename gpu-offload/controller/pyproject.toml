[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "gpu-offload-controller"
version = "0.0.0"
description = "Hardened Xavier-style admission mutate controller (gpu-offload)"
requires-python = ">=3.12"

dependencies = [
  "kubernetes==34.1.0",
  "PyYAML==6.0.2"
]

[project.optional-dependencies]
test = [
  "pytest==8.4.1"
]
