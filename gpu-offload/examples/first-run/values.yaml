image:
  registry: ""
  repository: gpu-offload-first-run
  tag: local
  digest: ""
  pullPolicy: Never

imagePullSecrets: []

serverStage:
  name: cpu
  wslNvidia:
    enabled: false
    resourceName: nvidia.com/gpu
    quantity: "1"
    driverLibraryPath: /usr/lib/wsl/lib
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

clientResources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
