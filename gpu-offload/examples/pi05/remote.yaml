# SPDX-License-Identifier: MIT
#
# Offload spec for the Pi0.5 (pi05) UR10e control loop.
#
# The GPU offload boundary is the policy wrapper in pi05_policy.py:
#     policy = Pi05Policy(pretrained_path=..., device="cuda", task=...)
#     policy.load()                                     # <- offload boundary
#     action = policy.select_action(state, frames, task)  # <- offload boundary
#
# The wrapper exists because lerobot resolves the concrete policy through
# get_policy_class(cfg.type) rather than a decorable module attribute, and because
# lerobot's own select_action exchanges torch tensors that the MessagePack codec
# rejects. Everything crossing the wire here is str, float, bytes, list, or dict.
#
# The chart renders this same spec into a ConfigMap with the server image and
# resources filled in; see templates/manifests.yaml.tpl. Validated against
# ../../specifications/remote-spec-schema.md.
serverstages:
  - name: gpu
    perclient: false
    resources:
      requests:
        cpu: "2"
        memory: 16Gi
      limits:
        cpu: "8"
        memory: 32Gi
        nvidia.com/gpu: "1"
remoteclasses:
  - "pi05_policy/Pi05Policy":
      remoteloc: gpu
remotefuncs:
  # load pulls roughly 7 GB of weights onto the GPU; singleinstance keeps one loaded
  # policy per stage so every control cycle reuses it instead of reloading.
  - "pi05_policy/Pi05Policy/load":
      singleinstance: true
      remoteloc: gpu
  - "pi05_policy/Pi05Policy/reset":
      singleinstance: true
      remoteloc: gpu
  - "pi05_policy/Pi05Policy/select_action":
      singleinstance: true
      remoteloc: gpu
