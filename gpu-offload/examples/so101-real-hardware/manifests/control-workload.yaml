# SPDX-License-Identifier: MIT
# Adapted from Microsoft Research "xavier-tutorial" (GPU-offloading reference architecture).
#
# Control-loop workload for the real-hardware SO101 VLA example. This runs the
# lightweight, non-GPU control container next to the robot; the policy action-selection
# call (the offload boundary in run_vla.py) executes in a GPU server-stage pod that the
# platform injects when this workload opts in.
#
# Offload opt-in (all three are required):
#   - label       xavier: "true"        selects this workload for the mutating webhook
#   - annotation  xavierconfig          points at the offload ConfigMap (so101-vla-offload)
#   - env         REMOTERPORT           remoter endpoint the control container connects to
#
# Contract: ../../../specifications/gpu-offload.specification.md
#
# The image is operator-supplied: build a control image that contains run_vla.py, the
# vendored ROS2 bridge (../ros2_bridge/), and the LeRobot runtime, then set it below.
# Never reference an internal registry FQDN; use a registry you control.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: so101-vla-control
  labels:
    app.kubernetes.io/name: so101-real-hardware
    app.kubernetes.io/component: control-loop
    # Opt into GPU offloading. Only workloads labeled xavier: "true" are mutated.
    xavier: "true"
  annotations:
    # References the offload ConfigMap by name and declares the injected env. The
    # ConfigMap holds remote.yaml under its data.remote.yaml key.
    xavierconfig: |
      remoteablecm: so101-vla-offload
      env:
        - name: REMOTERPORT
          value: "30001"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: so101-real-hardware
      app.kubernetes.io/component: control-loop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: so101-real-hardware
        app.kubernetes.io/component: control-loop
        # The pod template must also carry the label for the webhook selector.
        xavier: "true"
    spec:
      # For closed-loop control, pin this control pod to the same node as the injected
      # GPU server-stage pod so offload traffic stays on the host network rather than
      # crossing the cluster fabric. Set nodeName / nodeSelector to your GPU host.
      # nodeSelector:
      #   kubernetes.io/hostname: <gpu-host>
      containers:
        - name: control
          # Operator-supplied control image. Prefer a digest pin over a mutable tag.
          image: <your-registry>.azurecr.io/<control-image>:<tag>
          command: ["python3", "run_vla.py"]
          env:
            # Remoter endpoint the control container connects to for offloaded calls.
            - name: REMOTERPORT
              value: "30001"
            # Supply the trained SmolVLA checkpoint path; run_vla.py reads MODEL_ID.
            - name: MODEL_ID
              value: "<checkpoint-path>"
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
