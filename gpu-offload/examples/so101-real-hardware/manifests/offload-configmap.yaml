# SPDX-License-Identifier: MIT
# Adapted from Microsoft Research "xavier-tutorial" (GPU-offloading reference architecture).
#
# ConfigMap that carries the offload spec (remote.yaml) for the SO101 VLA control loop.
# The control workload references this ConfigMap by name through its `xavierconfig`
# annotation (see control-workload.yaml). Keep the embedded remote.yaml in sync with
# ../remote.yaml; the copy here is the source of truth the platform reads at admission.
apiVersion: v1
kind: ConfigMap
metadata:
  name: so101-vla-offload
  labels:
    app.kubernetes.io/name: so101-real-hardware
    app.kubernetes.io/component: offload-config
data:
  remote.yaml: |
    serverstages:
      - name: gpu
        perclient: false
        resources:
          limits:
            nvidia.com/gpu: 1
    remoteclasses:
      - "lerobot.policies.smolvla.modeling_smolvla/SmolVLAPolicy":
          remoteloc: gpu
    remotefuncs:
      - "lerobot.policies.smolvla.modeling_smolvla/SmolVLAPolicy/select_action":
          singleinstance: true
          remoteloc: gpu
