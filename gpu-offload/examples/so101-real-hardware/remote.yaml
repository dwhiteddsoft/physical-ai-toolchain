# SPDX-License-Identifier: MIT
# Adapted from Microsoft Research "xavier-tutorial" (GPU-offloading reference architecture).
#
# Offload spec for the real-hardware SO101 VLA control loop.
#
# The GPU offload boundary is the policy action-selection call in
# ros2_bridge/examples/so101_ros/run_vla.py:
#     from lerobot.policies.smolvla.modeling_smolvla import SmolVLAPolicy
#     model = SmolVLAPolicy.from_pretrained(model_id)
#     action_motor = model.select_action(obs)   # <- offload boundary
#
# The fully-qualified paths below MUST match those importable symbols exactly. This
# file is embedded under data.remote.yaml in manifests/offload-configmap.yaml and is
# validated against ../../specifications/remote-spec-schema.md.
serverstages:
  - name: gpu
    perclient: false
    resources:
      limits:
        nvidia.com/gpu: 1
remoteclasses:
  - "lerobot.policies.smolvla.modeling_smolvla/SmolVLAPolicy":
      remoteloc: gpu
remotefuncs:
  # select_action loads the SmolVLA model once (via from_pretrained) and reuses it
  # across every control-loop cycle, so the underlying object is shared:
  # singleinstance: true.
  - "lerobot.policies.smolvla.modeling_smolvla/SmolVLAPolicy/select_action":
      singleinstance: true
      remoteloc: gpu
